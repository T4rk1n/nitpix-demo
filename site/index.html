<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nitpix demo — dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><span class="logo"></span>Acme Analytics</h1>
    <nav>
      <a class="active" href="index.html">Dashboard</a>
      <a href="report.html">Report</a>
    </nav>
  </header>

  <section class="cards">
    <div class="card">
      <div class="label">Revenue</div>
      <div class="value">$48,210</div>
      <div class="delta">+12.4%</div>
    </div>
    <div class="card">
      <div class="label">Active users</div>
      <div class="value">9,384</div>
      <div class="delta">+3.1%</div>
    </div>
    <div class="card">
      <div class="label">Churn</div>
      <div class="value">1.9%</div>
      <div class="delta down">-0.4%</div>
    </div>
    <div class="card">
      <div class="label">Uptime</div>
      <div class="value">99.98%</div>
      <div class="delta">stable</div>
    </div>
  </section>

  <section class="panel">
    <h2>Weekly volume</h2>
    <div class="chart">
      <div class="bar" style="height: 42%"></div>
      <div class="bar" style="height: 65%"></div>
      <div class="bar" style="height: 51%"></div>
      <div class="bar" style="height: 88%"></div>
      <div class="bar" style="height: 74%"></div>
      <div class="bar" style="height: 96%"></div>
      <div class="bar" style="height: 60%"></div>
      <div class="bar" style="height: 79%"></div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background: var(--accent)"></span>Organic</span>
      <span><span class="dot" style="background: var(--accent-2)"></span>Referral</span>
    </div>
  </section>
</body>
</html>
