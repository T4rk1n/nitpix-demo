name: nitpix approve

# Handles `/nitpix approve` comments on PRs: records the approved snapshot
# hashes and flips the `nitpix/visual` status green without re-running tests.
# Requires write access on the repo.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  approve:
    name: Approve visual changes
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/nitpix')
    steps:
      - uses: plotly/nitpix/approve@main
